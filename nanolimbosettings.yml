# Managed by AMP: this file is rewritten from the AMP Configuration tab on every start.
# Change settings in AMP rather than editing this file.

bind:
  ip: "{{bind.ip}}"
  port: {{bind.port}}

maxPlayers: {{maxPlayers}}

ping:
  description: "{{ping.description}}"
  version: "{{ping.version}}"
  protocol: {{ping.protocol}}

dimension: {{dimension}}

playerList:
  enable: {{playerList.enable}}
  username: "{{playerList.username}}"

headerAndFooter:
  enable: {{headerAndFooter.enable}}
  header: "{{headerAndFooter.header}}"
  footer: "{{headerAndFooter.footer}}"

gameMode: {{gameMode}}

secureProfile: {{secureProfile}}

brandName:
  enable: {{brandName.enable}}
  content: "{{brandName.content}}"

joinMessage:
  enable: {{joinMessage.enable}}
  text: "{{joinMessage.text}}"

bossBar:
  enable: {{bossBar.enable}}
  text: "{{bossBar.text}}"
  health: 1.0
  color: {{bossBar.color}}
  division: SOLID

actionBar:
  enable: {{actionBar.enable}}
  text: "{{actionBar.text}}"

title:
  enable: {{title.enable}}
  title: "{{title.title}}"
  subtitle: "{{title.subtitle}}"
  fadeIn: 10
  stay: 100
  fadeOut: 10

infoForwarding:
  type: {{infoForwarding.type}}
  secret: "{{infoForwarding.secret}}"
  tokens:
  - "{{infoForwarding.tokens}}"

readTimeout: {{readTimeout}}

logPlayersIp: {{logPlayersIp}}

debugLevel: {{debugLevel}}

netty:
  transportType: EPOLL
  threads:
    bossGroup: 1
    workerGroup: 4

traffic:
  enable: {{traffic.enable}}
  maxPacketSize: 8192
  interval: 7.0
  maxPacketRate: 500.0
  maxPacketBytesRate: 2048.0
