# AMP managed - regenerated on every start from AMP's Configuration tab. Do not edit.
# Race, track, car and server options are set in the Server Manager web interface.
steam:
  username: ""
  password: ""
  install_path: "../302550"
  executable_path: "acServer"
  force_update: false

http:
  hostname: "0.0.0.0:{{http.port}}"
  session_key: "{{http.session_key}}"
  server_manager_base_URL: "{{http.server_manager_base_URL}}"
  session_store_type: cookie
  session_store_path: ""
  tls:
    enabled: false
    cert_path: ""
    key_path: ""

monitoring:
  enabled: {{monitoring.enabled}}

store:
  type: json
  path: data
  shared_data_path:
  scheduled_event_check_loop: 0s

accounts:
  admin_password_override: "{{accounts.admin_password_override}}"

live_map:
  refresh_interval_ms: {{live_map.refresh_interval_ms}}

server:
  audit_logging: {{server.audit_logging}}
  performance_mode: {{server.performance_mode}}
  dont_open_browser: true
  scan_content_folder_for_changes: false
  use_car_name_cache: true
  persist_mid_session_results: {{server.persist_mid_session_results}}
  plugins:

championships:
  recaptcha:
    site_key: "{{championships.recaptcha.site_key}}"
    secret_key: "{{championships.recaptcha.secret_key}}"

lua:
  enabled: false
