# AMP managed - regenerated on every start from AMP's Configuration tab. Do not edit.
forceRelayOnly: {{forceRelayOnly}}
integratedRelay:
  enabled: {{integratedRelay.enabled}}
  externalIps: '{{integratedRelay.externalIps}}'
  minPort: {{integratedRelay.minPort}}
  maxPort: {{integratedRelay.maxPort}}
  listeningPort: {{integratedRelay.listeningPort}}
  debugLevel: '{{integratedRelay.debugLevel}}'
  defaultUsername: '{{integratedRelay.defaultUsername}}'
  defaultPassword: '{{integratedRelay.defaultPassword}}'
iceServers:
  - urls: '{{iceServers.stun}}'
