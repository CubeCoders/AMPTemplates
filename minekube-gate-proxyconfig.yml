
# AMP managed - regenerated on every start from AMP's Configuration tab. Do not edit.
# Add your own Gate settings in config.user.yml instead.
<<: *root
config:
  <<: *config
  bind: {{config.bind}}
  servers: {{config.servers}}
  try: {{config.try}}
  status:
    <<: *status
    motd: "{{config.status.motd}}"
    favicon: "{{config.status.favicon}}"
  forwarding:
    <<: *forwarding
    mode: {{config.forwarding.mode}}
    velocitySecret: "{{config.forwarding.velocitySecret}}"
  lite:
    <<: *lite
    enabled: {{config.lite.enabled}}
    routes: {{config.lite.routes}}
connect:
  <<: *connect
  enabled: {{connect.enabled}}
  name: "{{connect.name}}"
